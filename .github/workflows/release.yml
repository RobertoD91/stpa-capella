name: Release STPA Update Site

# Publish a GitHub Release with the corrected update-site and dropins archives
# for every supported Capella line. Triggered by pushing a tag like "v0.2.2",
# or manually for a given version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.2'
        required: true
        default: '0.2.2'

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

  build:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        capella_version: ['5.0', '5.1', '5.2', '6.0', '6.1', '7.0', '7.0.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-capella${{ matrix.capella_version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-capella${{ matrix.capella_version }}-
            ${{ runner.os }}-maven-

      - name: Build release artifacts
        run: >
          mvn clean package
          -P capella-${{ matrix.capella_version }}
          -Drevision=${{ needs.meta.outputs.version }}-SNAPSHOT
          -Declipse.p2.mirrors=false
          --batch-mode
          --no-transfer-progress

      - name: Validate update site structure
        run: |
          python3 releng/com.thalesgroup.mde.capella.stpa.update/validate-repository.py \
            releng/com.thalesgroup.mde.capella.stpa.update/target/repository

      - name: Collect artifacts (strip -SNAPSHOT from file names)
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          TGT="releng/com.thalesgroup.mde.capella.stpa.update/target"
          OUT="${{ github.workspace }}/release-artifacts"
          mkdir -p "${OUT}"
          for kind in updateSite dropins; do
            src=$(ls ${TGT}/STPA-${kind}-capella*-${VER}-SNAPSHOT.zip)
            dst=$(basename "${src}" | sed "s/-${VER}-SNAPSHOT[.]zip/-${VER}.zip/")
            cp "${src}" "${OUT}/${dst}"
            echo "Packaged ${dst}"
          done

      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stpa-capella${{ matrix.capella_version }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stpa-capella*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -1 STPA-*.zip
          sha256sum STPA-*.zip > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ===" ; cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: STPA ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          body: |
            STPA Add-On — version ${{ needs.meta.outputs.version }}, built for Capella 5.0, 5.1, 5.2, 6.0, 6.1, 7.0 and 7.0.1.

            Pick the `updateSite` (recommended) or `dropins` archive that matches your Capella version.

            Installation (update site):
            - Add `STPA-updateSite-capella<version>-${{ needs.meta.outputs.version }}.zip` as an archived site in "Install New Software…".
            - Keep "Contact all update sites during install to find required software" enabled.
            - The core **STPA Add-On (Experimental)** category installs on a clean Capella with no extra update site.
            - The optional **HTML Documentation Generation** category requires the official Capella XHTML Documentation Generation add-on; the update site references the matching add-on, so the installer fetches it automatically (needs access to download.eclipse.org). With the dropins archive, install that add-on beforehand.

            SHA-256 of every archive is in `SHA256SUMS.txt`.
          files: |
            dist/STPA-*.zip
            dist/SHA256SUMS.txt
