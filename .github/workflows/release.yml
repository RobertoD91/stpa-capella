name: Release STPA Update Site

# Publish a GitHub Release with the corrected update-site and dropins archives.
# Triggered by pushing a tag like "v0.2.2", or manually for a given version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.2'
        required: true
        default: '0.2.2'
      capella_version:
        description: 'Capella version to build for'
        required: false
        default: '7.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAPELLA_VERSION: ${{ github.event.inputs.capella_version || '7.0.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-capella${{ env.CAPELLA_VERSION }}-${{ hashFiles('**/pom.xml', '**/capella-7.0.1.target') }}
          restore-keys: |
            ${{ runner.os }}-maven-capella${{ env.CAPELLA_VERSION }}-
            ${{ runner.os }}-maven-

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (Capella ${CAPELLA_VERSION})"

      - name: Build release artifacts
        run: >
          mvn clean package
          -P capella-${{ env.CAPELLA_VERSION }}
          -Drevision=${{ steps.ver.outputs.version }}-SNAPSHOT
          -Declipse.p2.mirrors=false
          --batch-mode
          --no-transfer-progress

      - name: Validate update site structure
        run: |
          python3 releng/com.thalesgroup.mde.capella.stpa.update/validate-repository.py \
            releng/com.thalesgroup.mde.capella.stpa.update/target/repository

      - name: Collect artifacts and checksums
        id: collect
        run: |
          set -euo pipefail
          # Tycho requires a -SNAPSHOT Maven version while the OSGi versions carry
          # the .qualifier suffix, so we build as -SNAPSHOT and drop that suffix from
          # the published file names. The p2 content (qualifier timestamp) is identical.
          VER="${{ steps.ver.outputs.version }}"
          TGT="releng/com.thalesgroup.mde.capella.stpa.update/target"
          OUT="${{ github.workspace }}/release-artifacts"
          mkdir -p "${OUT}"
          for kind in updateSite dropins; do
            src=$(ls ${TGT}/STPA-${kind}-capella*-${VER}-SNAPSHOT.zip)
            dst=$(basename "${src}" | sed "s/-${VER}-SNAPSHOT[.]zip/-${VER}.zip/")
            cp "${src}" "${OUT}/${dst}"
            echo "Packaged ${dst}"
          done
          ( cd "${OUT}" && sha256sum STPA-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )
          echo "dir=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: STPA ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            STPA Add-On for Capella ${{ env.CAPELLA_VERSION }} — version ${{ steps.ver.outputs.version }}.

            Installation:
            - Add the `STPA-updateSite-capella${{ env.CAPELLA_VERSION }}-${{ steps.ver.outputs.version }}.zip` as an archived update site in "Install New Software…".
            - Keep "Contact all update sites during install to find required software" enabled.
            - The core **STPA Add-On (Experimental)** category installs on a clean Capella with no extra update site.
            - The optional **HTML Documentation Generation** category requires the official Capella XHTML Documentation Generation add-on; the update site references it, so the installer fetches it automatically (needs network access to download.eclipse.org). When using the dropins archive instead, install that add-on beforehand.

            Each archive's SHA-256 is listed in `SHA256SUMS.txt`.
          files: |
            release-artifacts/STPA-updateSite-capella*.zip
            release-artifacts/STPA-dropins-capella*.zip
            release-artifacts/SHA256SUMS.txt
