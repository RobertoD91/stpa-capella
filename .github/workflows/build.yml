name: Build and Validate STPA Update Site

on:
  push:
    branches: [master, main]
    paths:
      - 'features/**'
      - 'plugins/**'
      - 'releng/**'
      - 'doc/**'
      - '**/pom.xml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      capella_version:
        description: 'Capella version to build for'
        required: false
        default: '7.0.1'
        type: choice
        options:
          - '7.0.1'
          - '7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        capella_version:
          - '7.0.1'
      fail-fast: false

    env:
      REPO_DIR: ${{ github.workspace }}/releng/com.thalesgroup.mde.capella.stpa.update/target/repository
      # Capella 7.0.x platform p2 repositories, mirroring the build target platform
      # but WITHOUT the EGF and XHTML Documentation Generation add-on repositories.
      # The core STPA feature must resolve against this set alone (clean Capella);
      # the optional docgen feature resolves once the XHTML Documentation
      # Generation add-on repository (ADDON_REPO) is added.
      PLATFORM_REPOS: >-
        https://download.eclipse.org/capella/core/updates/releases/7.0.0/org.polarsys.capella.rcp.site/,https://download.eclipse.org/kitalpha/updates/releases/runtime/7.0.1/,https://download.eclipse.org/kitalpha/updates/releases/sdk/7.0.1/,https://download.eclipse.org/sirius/updates/releases/7.4.5/2023-03,https://download.eclipse.org/modeling/amalgam/updates/releases/1.14.0/capella/,https://download.eclipse.org/modeling/gmp/gmf-runtime/updates/milestones/S202401081627,https://download.eclipse.org/modeling/gmp/gmf-notation/updates/releases/R202211151334,https://download.eclipse.org/nattable/releases/2.1.0/repository/,https://download.eclipse.org/nebula/releases/3.0.0/,https://download.eclipse.org/tools/gef/classic/releases/3.17.0,https://download.eclipse.org/diffmerge/releases/0.15.0/emf-diffmerge-site/,https://download.eclipse.org/mylyn/releases/3.26/,https://download.eclipse.org/tools/orbit/downloads/drops/R20230302014618/repository/,https://download.eclipse.org/releases/2023-03
      # The add-on update site that the STPA update site references; it provides
      # org.polarsys.capella.docgen and the EGF runtime required by the docgen feature.
      ADDON_REPO: https://download.eclipse.org/capella/addons/xhtmldocgen/updates/releases/7.0.0/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-capella${{ matrix.capella_version }}-${{ hashFiles('**/pom.xml', '**/capella-7.0.1.target') }}
          restore-keys: |
            ${{ runner.os }}-maven-capella${{ matrix.capella_version }}-
            ${{ runner.os }}-maven-

      - name: Build with Maven/Tycho
        run: >
          mvn clean package
          -P capella-${{ matrix.capella_version }}
          -Declipse.p2.mirrors=false
          --batch-mode
          --no-transfer-progress

      - name: Validate update site structure
        run: |
          echo "=== Update site contents ==="
          echo "Features:" ; ls -1 "${REPO_DIR}/features/" || true
          echo "Plugins:"  ; ls -1 "${REPO_DIR}/plugins/"  || true
          echo ""
          python3 releng/com.thalesgroup.mde.capella.stpa.update/validate-repository.py "${REPO_DIR}"

      - name: Verify referenced add-on repository provides the docgen dependencies
        run: |
          set -euo pipefail
          ADDON="https://download.eclipse.org/capella/addons/xhtmldocgen/updates/releases/7.0.0"
          echo "Checking ${ADDON} ..."
          curl -sSL -o /tmp/addon-content.jar "${ADDON}/content.jar"
          unzip -o -q /tmp/addon-content.jar -d /tmp/addon-content
          for iu in org.eclipse.egf.pattern org.eclipse.egf.pattern.ftask org.polarsys.capella.docgen; do
            if grep -q "id='${iu}'" /tmp/addon-content/content.xml; then
              echo "OK: referenced add-on provides ${iu}"
            else
              echo "ERROR: referenced add-on does NOT provide ${iu}"
              exit 1
            fi
          done

      - name: Download Eclipse platform (p2 director)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          URL="https://download.eclipse.org/eclipse/downloads/drops4/R-4.27-202303020300/eclipse-platform-4.27-linux-gtk-x86_64.tar.gz"
          curl -sSL -o /tmp/eclipse.tar.gz "${URL}"
          tar -xzf /tmp/eclipse.tar.gz -C /tmp

      - name: Validate clean install of CORE feature (p2 director, no docgen/EGF repos)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          /tmp/eclipse/eclipse -nosplash -consoleLog \
            -application org.eclipse.equinox.p2.director \
            -repository "file://${REPO_DIR},${PLATFORM_REPOS}" \
            -installIU com.thalesgroup.mde.capella.stpa.feature.feature.group \
            -destination /tmp/install-core -profile STPACore \
            -p2.os linux -p2.ws gtk -p2.arch x86_64 -roaming
          echo "OK: core STPA feature installs on a clean Capella with no extra update site."

      - name: Validate clean install of DOCGEN feature (p2 director, with the referenced add-on)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # The Capella install wizard follows the enabled repository-reference that the
          # update site declares (validated above by validate-repository.py), so an end
          # user only adds the STPA update site. The p2 director CLI does not follow
          # references, so here we add the add-on repository explicitly to prove that the
          # docgen dependency closure (capella.docgen + EGF) is fully resolvable.
          /tmp/eclipse/eclipse -nosplash -consoleLog \
            -application org.eclipse.equinox.p2.director \
            -repository "file://${REPO_DIR},${PLATFORM_REPOS},${ADDON_REPO}" \
            -installIU com.thalesgroup.mde.capella.stpa.docgen.feature.feature.group \
            -destination /tmp/install-docgen -profile STPADocgen \
            -p2.os linux -p2.ws gtk -p2.arch x86_64 -roaming
          echo "OK: docgen feature resolves against the referenced XHTML Documentation Generation add-on."

      - name: Upload update site artifact
        uses: actions/upload-artifact@v4
        with:
          name: STPA-updateSite-capella${{ matrix.capella_version }}
          path: releng/com.thalesgroup.mde.capella.stpa.update/target/STPA-updateSite-capella*.zip
          if-no-files-found: error

      - name: Upload dropins artifact
        uses: actions/upload-artifact@v4
        with:
          name: STPA-dropins-capella${{ matrix.capella_version }}
          path: releng/com.thalesgroup.mde.capella.stpa.update/target/STPA-dropins-capella*.zip
          if-no-files-found: error
